<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Transparent / Dark background wrapper for proper contrast -->
  <rect width="800" height="800" fill="#0d0d0d" />

  <g id="movie-mafia-logo" transform="translate(0, -10)">
    
    <!-- 1. WHITE OUTLINE / BACKING LAYER FOR THE EMBLEM -->
    <g id="white-outlines" fill="#FFFFFF" stroke="#FFFFFF" stroke-linejoin="round" stroke-linecap="round">
      
      <!-- Crown Outline -->
      <path d="M 280 430 
               C 275 360, 310 270, 340 250 
               C 365 235, 385 245, 400 255 
               C 415 245, 435 235, 460 250 
               C 490 270, 525 360, 520 430 Z" 
            stroke-width="28" />

      <!-- Brim Outline -->
      <path d="M 140 430 
               C 230 430, 290 475, 400 475 
               C 510 475, 570 430, 660 430 
               C 710 430, 725 470, 670 495 
               C 580 535, 490 515, 400 515 
               C 310 515, 220 535, 130 495 
               C 75 470, 90 430, 140 430 Z" 
            stroke-width="28" />

      <!-- Front Tulip Outline (Mounted on the Front Center of Hat) -->
      <!-- Left Petal Backing -->
      <path d="M 400 390 
               C 340 370, 305 300, 320 220 
               C 350 220, 385 260, 400 310 Z" 
            stroke-width="24" />
      
      <!-- Right Petal Backing -->
      <path d="M 400 390 
               C 460 370, 495 300, 480 220 
               C 450 220, 415 260, 400 310 Z" 
            stroke-width="24" />

      <!-- Center Cup Petal Backing -->
      <path d="M 400 395 
               C 355 350, 345 250, 400 170 
               C 455 250, 445 350, 400 395 Z" 
            stroke-width="24" />
    </g>

    <!-- 2. BLACK INNER SILHOUETTE LAYER -->
    <g id="black-shapes" fill="#000000" stroke="#000000" stroke-linejoin="round" stroke-linecap="round">
      
      <!-- Cowboy Hat Crown Silhouette -->
      <path d="M 280 430 
               C 275 360, 310 270, 340 250 
               C 365 235, 385 245, 400 255 
               C 415 245, 435 235, 460 250 
               C 490 270, 525 360, 520 430 Z" />

      <!-- Crown Side Crease Accents (Negative Space in White) -->
      <path d="M 330 280 C 320 340, 335 400, 345 420" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <path d="M 470 280 C 480 340, 465 400, 455 420" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

      <!-- Cowboy Hat Brim Silhouette -->
      <path d="M 140 430 
               C 230 430, 290 475, 400 475 
               C 510 475, 570 430, 660 430 
               C 710 430, 725 470, 670 495 
               C 580 535, 490 515, 400 515 
               C 310 515, 220 535, 130 495 
               C 75 470, 90 430, 140 430 Z" />

      <!-- Hat Band Accent Line -->
      <path d="M 282 435 C 340 460, 460 460, 518 435" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

      <!-- REALISTIC TULIP FLOWER (ON THE FRONT OF THE HAT) -->
      
      <!-- Outer Left Petal -->
      <path d="M 400 390 
               C 340 370, 305 300, 320 220 
               C 350 220, 385 260, 400 310 Z" 
            stroke="#FFFFFF" stroke-width="5" />

      <!-- Outer Right Petal -->
      <path d="M 400 390 
               C 460 370, 495 300, 480 220 
               C 450 220, 415 260, 400 310 Z" 
            stroke="#FFFFFF" stroke-width="5" />

      <!-- Center Main Cup Petal (Classic Tulip Bulb Shape) -->
      <path d="M 400 395 
               C 355 350, 345 250, 400 170 
               C 455 250, 445 350, 400 395 Z" 
            stroke="#FFFFFF" stroke-width="6" />

      <!-- Inner Petal Curve / Overlap Details (Classic Cup Realism) -->
      <path d="M 370 230 C 385 200, 400 190, 400 170" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <path d="M 400 395 C 380 340, 380 280, 400 240 C 420 280, 420 340, 400 395" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      
      <!-- Stem Base Anchoring Tulip to Front Band -->
      <path d="M 393 390 L 393 450 M 407 390 L 407 450" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    </g>

    <!-- 3. TYPOGRAPHY: MOVIE MAFIA -->
    <g id="typography">
      <!-- White Thick Text Outline -->
      <text x="400" y="615" 
            text-anchor="middle" 
            fill="#000000" 
            stroke="#FFFFFF" 
            stroke-width="16" 
            stroke-linejoin="round"
            font-family="'Impact', 'Cinzel', 'Arial Black', sans-serif" 
            font-size="62" 
            font-weight="900" 
            letter-spacing="9">
        MOVIE MAFIA
      </text>

      <!-- Inner Black Core Text -->
      <text x="400" y="615" 
            text-anchor="middle" 
            fill="#000000" 
            font-family="'Impact', 'Cinzel', 'Arial Black', sans-serif" 
            font-size="62" 
            font-weight="900" 
            letter-spacing="9">
        MOVIE MAFIA
      </text>
    </g>

  </g>
</svg>
